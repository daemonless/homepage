icon: ':material-view-dashboard:'

cit:
  mode: screenshot
  port: 3000
  ready: "Ready in"

build:
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
    - tag: pkg
      containerfile: Containerfile.pkg
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15-latest"
